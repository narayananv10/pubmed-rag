[project]
name = "pubmed-rag"
version = "0.1.0"
description = "RAG over PubMed NSCLC abstracts with citation-grounded answers"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Narayanan Venugopal" }]
dependencies = [
    "biopython>=1.83",
    "chromadb>=0.5.0,<0.6",
    # onnxruntime is a chromadb transitive dep; pinning <1.21 keeps macOS x86_64
    # wheels available. We never load onnxruntime at runtime (Voyage handles
    # embeddings) so the pin is purely for installability on Intel Homebrew.
    "onnxruntime>=1.18,<1.21",
    "voyageai>=0.3.0",
    "rank-bm25>=0.2.2",
    "anthropic>=0.40.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.115",
    "streamlit>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "matplotlib>=3.9",
    "jupyter>=1.1",
    "ruff>=0.7",
]

[project.scripts]
pubmed-rag = "pubmed_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pubmed_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
